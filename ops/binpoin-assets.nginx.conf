location ^~ /images/ {
    root /var/www/binpoin-assets;
    try_files $uri =404;
    autoindex off;
    expires 1h;
}

location ^~ /projects/ {
    root /var/www/binpoin-assets;
    try_files $uri =404;
    autoindex off;
    expires 1h;
}

location ^~ /pdfs/ {
    root /var/www/binpoin-assets;
    try_files $uri =404;
    autoindex off;
    expires 1h;
}

location ~ ^/[^/]+\.(?:pdf|svg|png|jpg|jpeg|webp|avif|gif|ico)$ {
    root /var/www/binpoin-assets;
    try_files $uri =404;
    autoindex off;
    expires 1h;
}